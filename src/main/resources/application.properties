spring.application.name=event_booking_system

# ===================================================================
# 1. Database Connection Settings (Cloud Environment Variables Ready)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ===================================================================
# 2. Server Configuration (Cloud Deployment Requirement)
# ===================================================================
server.port=${PORT:8080}

# ===================================================================
# 3. MyBatis Settings (XML Mapper)
# ===================================================================
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 4. Centralized Route Configuration
root-context.route=/api

# ===================================================================
# 5. Logging & JPA Settings
# ===================================================================
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=DEBUG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true