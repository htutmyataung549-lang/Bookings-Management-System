spring.application.name=event_booking_system
# 1. Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketing_db
spring.datasource.username=postgres
spring.datasource.password=663688
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. MyBatis Settings (XML Mapper)
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 3. Global JDBC Type Configuration (XML ထဲမှာ jdbcType=OTHER မရေးချင်ရင် ကာကွယ်ရန်)
#mybatis.configuration.jdbc-type-for-null=OTHER

# 4. Centralized Route Configuration
root-context.route=/api

# 5. Logging Settings
#logging.level.com.example.event_booking_system.mapper=DEBUG
# Validation Error တွေကို IntelliJ Console ထဲမှာ အသေးစိတ်ပြခိုင်းခြင်း
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=DEBUG