spring.application.name=event_booking_system

# ===================================================================
# 1. Database Connection Settings (Cloud Environment Variables Ready)

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticketing_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:663688}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# 2. Server Configuration (Vercel/Cloud Deployment Requirement)

server.port=${PORT:8080}

# ===================================================================
# 3. MyBatis Settings (XML Mapper)
# ===================================================================
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 4. Centralized Route Configuration
root-context.route=/api

# ===================================================================
# 5. Logging Settings
# ===================================================================
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=DEBUG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ⚠️ Render ပေါ်က Dialect Error ကို အပြီးတိုင် သတ်ပစ်မည့် စာကြောင်း
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect